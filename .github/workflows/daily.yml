name: OTT 看板 · 每日自动抓取与发布

# 触发：
#   1) 每天北京时间 06:00 自动跑（GitHub cron 为 UTC，06:00 CST = 22:00 UTC 前一天）
#   2) 允许在 Actions 页面手动触发（workflow_dispatch），方便调试
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

# 权限：contents 用于提交最新 data.js；pages/id-token 用于部署 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 避免并发重叠：同一时间只跑一个抓取任务
concurrency:
  group: ott-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright Chromium（browser 引擎源需要）
        run: python -m playwright install --with-deps chromium

      - name: 运行抓取管道（抓取 → AI 处理 → 导出 data.js）
        run: bash pipeline/run_pipeline.sh "$GITHUB_WORKSPACE"

      - name: 组装静态站点
        if: success()
        env:
          OTT_BUILD_ID: ${{ github.sha }}
        run: bash pipeline/build_site.sh

      - name: 提交最新 data.js（保留历史，便于追溯）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.js; then
            git add data.js
            git commit -m "data: 每日自动抓取 $(date '+%Y-%m-%d')"
            git push
          else
            echo "data.js 无变化，跳过提交"
          fi

      - name: 上传 Pages 产物
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 失败时开 Issue 告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `OTT 看板抓取失败 ${new Date().toISOString().slice(0,10)}`;
            const body = `每日自动抓取管道执行失败。\n\n查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            if (!issues.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
